[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jc-football-intelligence"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0.38,<2.1",
  "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.8,<3",
  "redis>=5,<7", "httpx>=0.28,<1", "apscheduler>=3.11,<4",
  "PyJWT>=2.10,<3", "pwdlib[argon2]>=0.2,<1", "tzdata>=2025.1", "email-validator>=2.2,<3"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "mypy>=1.15,<2", "ruff>=0.11,<1"]
[tool.setuptools.packages.find]
where = ["apps/api/src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
[tool.ruff]
target-version = "py312"
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B008"] # FastAPI dependency declarations are intentional.
[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402", "I001"] # Environment is set before application imports.
